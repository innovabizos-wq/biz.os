<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Biz.OS POS sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:15px system-ui,sans-serif}header{display:flex;justify-content:space-between;gap:12px;padding:18px 24px;background:#111827;color:#fff}main{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;padding:18px}.card{background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:16px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-height:65vh;overflow:auto}.product{padding:14px;border:1px solid #d1d5db;border-radius:12px;background:#fff;text-align:left}.product b,.product span{display:block}.product small{color:#6b7280}input,select,button{min-height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;font:inherit}button{cursor:pointer}.primary{background:#111827;color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.line{padding:10px 0;border-bottom:1px solid #e5e7eb}.muted{color:#6b7280}.notice{padding:10px;border-radius:10px;background:#fef3c7;color:#78350f}.total{font-size:22px;font-weight:700}.stack{display:grid;gap:10px}@media(max-width:850px){main{grid-template-columns:1fr}header{padding:14px}main{padding:12px}}
  </style>
</head>
<body>
  <header><div><b>Biz.OS · POS sin conexión</b><div id="terminal"></div></div><div><span id="pending">0 pendientes</span> · <span>Sin conexión</span></div></header>
  <main>
    <section class="card stack"><input id="search" placeholder="Buscar o escanear código"><div id="products" class="products"></div></section>
    <aside class="card stack"><h2>Venta provisional</h2><div id="cart"></div><div class="row total"><span>Total</span><span id="total">₡0</span></div><select id="method"><option value="cash">Efectivo</option><option value="card">Tarjeta externa autorizada</option><option value="sinpe">SINPE pendiente</option></select><input id="reference" placeholder="Referencia de pago"><button class="primary" id="save">Guardar para sincronizar</button><p class="notice" id="message">Esta constancia no es el comprobante fiscal. Biz.OS emitirá al recuperar conexión.</p></aside>
  </main>
  <script>
    const state={session:null,catalog:[],cart:new Map(),sequence:1};
    const money=new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC'});
    function db(){return new Promise((ok,no)=>{const r=indexedDB.open('bizos-pos',1);r.onerror=()=>no(r.error);r.onsuccess=()=>ok(r.result);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('operations')){const s=d.createObjectStore('operations',{keyPath:'clientOperationId'});s.createIndex('sessionId','sessionId')}if(!d.objectStoreNames.contains('catalog')){const s=d.createObjectStore('catalog',{keyPath:'key'});s.createIndex('sessionId','sessionId')}if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'})}})}
    function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
    async function load(){const d=await db();const sessions=await request(d.transaction('sessions').objectStore('sessions').getAll());state.session=sessions.filter(s=>s.status==='open'||s.status==='pending_sync').sort((a,b)=>b.openedAt.localeCompare(a.openedAt))[0];if(!state.session){document.querySelector('main').innerHTML='<section class="card"><h2>No hay una caja autorizada</h2><p>Abre y prepara la terminal mientras tengas conexión.</p></section>';return}document.getElementById('terminal').textContent=state.session.terminal.name;state.catalog=(await request(d.transaction('catalog').objectStore('catalog').index('sessionId').getAll(state.session.id)));const operations=await request(d.transaction('operations').objectStore('operations').index('sessionId').getAll(state.session.id));state.sequence=Math.max(state.session.lastSequence+1,...operations.map(o=>o.sequence+1));document.getElementById('pending').textContent=operations.length+' pendientes';d.close();renderProducts();renderCart()}
    function lineTotal(p,q){const sub=p.unitPrice*q;return Math.round((sub+sub*p.taxRate/100)*100)/100}
    function renderProducts(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('products').innerHTML=state.catalog.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)).slice(0,120).map(p=>`<button class="product" data-id="${p.productId}"><b>${p.name}</b><small>${p.code||p.productType}</small><span>${money.format(lineTotal(p,1))}</span><small>Cupo offline: ${p.productType==='servicio'?'—':p.offlineAvailable}</small></button>`).join('');document.querySelectorAll('.product').forEach(b=>b.onclick=()=>{const p=state.catalog.find(x=>x.productId===b.dataset.id);state.cart.set(p.productId,{...p,quantity:(state.cart.get(p.productId)?.quantity||0)+1});renderCart()})}
    function renderCart(){let total=0;document.getElementById('cart').innerHTML=[...state.cart.values()].map(p=>{total+=lineTotal(p,p.quantity);return `<div class="row line"><span><b>${p.name}</b><br><small class="muted">${p.quantity} × ${money.format(lineTotal(p,1))}</small></span><button data-remove="${p.productId}">−</button></div>`}).join('')||'<p class="muted">Selecciona productos.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const p=state.cart.get(b.dataset.remove);if(p.quantity<=1)state.cart.delete(p.productId);else state.cart.set(p.productId,{...p,quantity:p.quantity-1});renderCart()});document.getElementById('total').textContent=money.format(total);return Math.round(total*100)/100}
    async function save(){if(!state.cart.size)return;const total=renderCart();const unavailable=[...state.cart.values()].find(p=>p.productType==='producto'&&p.quantity>p.offlineAvailable);if(unavailable){document.getElementById('message').textContent='Cupo insuficiente para '+unavailable.name;return}const method=document.getElementById('method').value;const operation={capturedAt:new Date().toISOString(),clientOperationId:crypto.randomUUID(),items:[...state.cart.values()].map(p=>({productId:p.productId,quantity:p.quantity})),offline:true,payments:[{amount:total,method,reference:document.getElementById('reference').value||undefined,verified:method!=='sinpe'}],sequence:state.sequence,sessionId:state.session.id,queuedAt:new Date().toISOString()};const d=await db();const tx=d.transaction('operations','readwrite');tx.objectStore('operations').put(operation);await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});d.close();state.sequence++;state.cart.clear();document.getElementById('message').textContent='Venta '+operation.sequence+' guardada. Se sincronizará al recuperar conexión.';renderCart();await load()}
    document.getElementById('search').oninput=renderProducts;document.getElementById('save').onclick=save;window.addEventListener('online',()=>location.href='/ventas/pos');load().catch(e=>document.getElementById('message').textContent='No se pudo abrir la caja local: '+e.message);
  </script>
</body>
</html>
